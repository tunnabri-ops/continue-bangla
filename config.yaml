# Continue config — Bangla-first, local Ollama models
# Copy to ~/.continue/config.yaml
name: Bangla Local Assistant
version: 1.0.0
schema: v1
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
rules:
  - "Always explain code in Bangla (বাংলা) unless the user writes in English."
  - "Keep code and code comments in English."
  - "Never invent library APIs — if unsure, say so in Bangla."
models:
  - name: Qwen2.5 Coder 7B (chat + edit)
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles: [chat, edit, apply]
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 2048
  - name: StarCoder2 3B (autocomplete)
    provider: ollama
    model: starcoder2:3b
    apiBase: http://localhost:11434
    roles: [autocomplete]
docs:
  - startUrl: https://docs.continue.dev
    useEmbeddings: true
